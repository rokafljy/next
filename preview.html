<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>청년일경험 선발관리 시스템 | 커넥팅더닷츠</title>
<meta name="description" content="2026 청년일경험지원사업 신청자 선발관리 — 서류심사 · 인터뷰 · 최종선발 통합 대시보드">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
/* ============================================================
   청년일경험 선발관리 시스템 — Design System
   Palette continued from the 라이나생명 report (navy / teal)
   ============================================================ */
:root {
  --navy:        #0B1F3A;
  --navy-2:      #0f2d52;
  --teal:        #00A99D;
  --teal-light:  #4EC9C3;
  --teal-dark:   #007A73;
  --indigo:      #3B5BDB;
  --indigo-light:#748FFC;
  --amber:       #F5A623;
  --red:         #E8503A;
  --green:       #2BB673;
  --purple:      #8C5BE6;

  --bg:        #F4F7FB;
  --white:     #FFFFFF;
  --gray-1:    #F0F3F8;
  --gray-2:    #E2E8F2;
  --gray-3:    #C4CFDE;
  --gray-4:    #9BA8BC;
  --text-main: #1A2B45;
  --text-sub:  #5A6A82;
  --text-mute: #8A98AE;

  --radius:    14px;
  --radius-sm: 9px;
  --shadow-sm: 0 2px 10px rgba(11,31,58,0.06);
  --shadow-md: 0 6px 22px rgba(11,31,58,0.10);
  --shadow-lg: 0 18px 48px rgba(11,31,58,0.18);
  --sidebar-w: 252px;
}

* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }
body {
  font-family:'Noto Sans KR', sans-serif;
  background:var(--bg); color:var(--text-main);
  line-height:1.6; -webkit-font-smoothing:antialiased;
}
a { color:inherit; text-decoration:none; }
button { font-family:inherit; cursor:pointer; border:none; background:none; }
input, select, textarea { font-family:inherit; font-size:14px; }
::-webkit-scrollbar { width:10px; height:10px; }
::-webkit-scrollbar-thumb { background:var(--gray-3); border-radius:100px; border:2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background:var(--gray-4); }

/* ─── LAYOUT ─── */
.app-shell { display:flex; min-height:100vh; }

.sidebar {
  width:var(--sidebar-w); flex-shrink:0; position:fixed; top:0; bottom:0; left:0;
  background:linear-gradient(180deg, #071629 0%, var(--navy) 60%, #0c2547 100%);
  color:#fff; display:flex; flex-direction:column; z-index:40;
}
.sb-brand { padding:26px 24px 22px; border-bottom:1px solid rgba(255,255,255,0.08); }
.sb-badge {
  display:inline-block; background:rgba(0,169,157,0.18); border:1px solid rgba(0,169,157,0.45);
  color:var(--teal-light); font-size:10px; font-weight:700; letter-spacing:1.5px;
  text-transform:uppercase; padding:4px 11px; border-radius:100px; margin-bottom:13px;
}
.sb-title { font-size:17px; font-weight:800; line-height:1.35; letter-spacing:-0.3px; }
.sb-title span { color:var(--teal-light); }
.sb-sub { font-size:11px; color:rgba(255,255,255,0.45); margin-top:5px; }

.sb-nav { flex:1; overflow-y:auto; padding:14px 14px 20px; }
.sb-nav::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.18); border-color:transparent; }
.sb-group-label { font-size:10px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase;
  color:rgba(255,255,255,0.32); padding:16px 12px 8px; }
.sb-item {
  display:flex; align-items:center; gap:12px; padding:11px 13px; border-radius:10px;
  color:rgba(255,255,255,0.66); font-size:13.5px; font-weight:500; margin-bottom:3px;
  transition:background .15s, color .15s; cursor:pointer; position:relative;
}
.sb-item:hover { background:rgba(255,255,255,0.07); color:#fff; }
.sb-item.active { background:linear-gradient(90deg, rgba(0,169,157,0.28), rgba(0,169,157,0.05)); color:#fff; }
.sb-item.active::before { content:''; position:absolute; left:0; top:8px; bottom:8px; width:3px;
  border-radius:3px; background:var(--teal-light); }
.sb-item .ico { width:18px; height:18px; flex-shrink:0; opacity:.92; }
.sb-item .badge-count {
  margin-left:auto; background:rgba(255,255,255,0.12); color:#fff; font-size:11px; font-weight:700;
  padding:1px 8px; border-radius:100px; min-width:22px; text-align:center;
}
.sb-item.active .badge-count { background:var(--teal); }

.sb-foot { padding:16px 20px; border-top:1px solid rgba(255,255,255,0.08); font-size:11px; color:rgba(255,255,255,0.38); }
.sb-foot strong { color:rgba(255,255,255,0.7); display:block; font-size:12px; margin-bottom:2px; }

.main { flex:1; margin-left:var(--sidebar-w); min-width:0; }

/* ─── TOPBAR ─── */
.topbar {
  position:sticky; top:0; z-index:30; background:rgba(244,247,251,0.85); backdrop-filter:blur(10px);
  display:flex; align-items:center; gap:18px; padding:18px 36px; border-bottom:1px solid var(--gray-2);
}
.topbar h1 { font-size:21px; font-weight:800; letter-spacing:-0.4px; }
.topbar .crumb { font-size:12px; color:var(--text-mute); margin-top:2px; }
.topbar-spacer { flex:1; }
.search-box { position:relative; }
.search-box input {
  width:280px; padding:10px 14px 10px 38px; border:1px solid var(--gray-2); border-radius:100px;
  background:#fff; color:var(--text-main); transition:border .15s, box-shadow .15s;
}
.search-box input:focus { outline:none; border-color:var(--teal); box-shadow:0 0 0 3px rgba(0,169,157,0.12); }
.search-box svg { position:absolute; left:13px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--gray-4); }

.content { padding:30px 36px 70px; max-width:1480px; }

/* ─── BUTTONS ─── */
.btn { display:inline-flex; align-items:center; gap:7px; padding:10px 18px; border-radius:10px;
  font-size:13.5px; font-weight:600; transition:all .15s; white-space:nowrap; }
.btn svg { width:16px; height:16px; }
.btn-primary { background:var(--teal); color:#fff; }
.btn-primary:hover { background:var(--teal-dark); box-shadow:0 4px 14px rgba(0,122,115,0.3); }
.btn-navy { background:var(--navy); color:#fff; }
.btn-navy:hover { background:var(--navy-2); }
.btn-ghost { background:#fff; color:var(--text-main); border:1px solid var(--gray-2); }
.btn-ghost:hover { border-color:var(--gray-3); background:var(--gray-1); }
.btn-danger { background:#fff; color:var(--red); border:1px solid #f3c8c0; }
.btn-danger:hover { background:#fdf0ed; }
.btn-sm { padding:7px 13px; font-size:12.5px; }
.btn:disabled { opacity:.5; cursor:not-allowed; }

/* ─── CARDS / SECTIONS ─── */
.card { background:#fff; border:1px solid var(--gray-2); border-radius:var(--radius); box-shadow:var(--shadow-sm); }
.section-title { font-size:15px; font-weight:800; letter-spacing:-0.2px; display:flex; align-items:center; gap:9px; }
.section-title .dot { width:8px; height:8px; border-radius:3px; background:var(--teal); }
.section-sub { font-size:12px; color:var(--text-mute); margin-top:2px; }
.grid { display:grid; gap:16px; }

/* ─── KPI ─── */
.kpi-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin-bottom:22px; }
.kpi { background:#fff; border:1px solid var(--gray-2); border-radius:var(--radius); padding:20px 18px;
  box-shadow:var(--shadow-sm); position:relative; overflow:hidden; transition:transform .18s, box-shadow .18s; }
.kpi:hover { transform:translateY(-2px); box-shadow:var(--shadow-md); }
.kpi::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--c, var(--teal)); }
.kpi-label { font-size:12px; color:var(--text-sub); font-weight:600; display:flex; align-items:center; gap:7px; }
.kpi-ico { width:30px; height:30px; border-radius:8px; display:grid; place-items:center;
  background:color-mix(in srgb, var(--c, var(--teal)) 14%, #fff); color:var(--c, var(--teal)); }
.kpi-ico svg { width:17px; height:17px; }
.kpi-val { font-size:34px; font-weight:900; line-height:1.05; margin-top:12px; letter-spacing:-1px; }
.kpi-val small { font-size:15px; font-weight:600; color:var(--text-mute); }
.kpi-meta { font-size:11.5px; color:var(--text-mute); margin-top:7px; display:flex; align-items:center; gap:5px; }
.kpi-meta .up { color:var(--green); font-weight:700; }
.kpi-meta .dn { color:var(--red); font-weight:700; }

/* ─── FUNNEL ─── */
.funnel { display:flex; gap:0; align-items:stretch; }
.funnel-step { flex:1; padding:18px 16px; position:relative; text-align:center; }
.funnel-step:not(:last-child)::after {
  content:''; position:absolute; right:-1px; top:24px; bottom:24px; width:1px; background:var(--gray-2); }
.funnel-num { font-size:30px; font-weight:900; letter-spacing:-1px; }
.funnel-label { font-size:12px; color:var(--text-sub); font-weight:600; margin-top:4px; }
.funnel-rate { font-size:11px; color:var(--text-mute); margin-top:3px; }
.funnel-bar { height:5px; border-radius:100px; background:var(--gray-1); margin-top:11px; overflow:hidden; }
.funnel-bar i { display:block; height:100%; border-radius:100px; }

/* ─── CHART GRID ─── */
.chart-grid { display:grid; grid-template-columns:1.4fr 1fr; gap:16px; margin-top:16px; }
.chart-card { padding:22px 24px; }
.chart-head { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:6px; }
.chart-wrap { position:relative; height:280px; margin-top:14px; }
.chart-wrap.sm { height:230px; }

/* ─── TABLE ─── */
.table-wrap { overflow-x:auto; }
table.dt { width:100%; border-collapse:collapse; font-size:13.5px; }
table.dt thead th {
  text-align:left; font-size:11.5px; font-weight:700; color:var(--text-sub); text-transform:uppercase;
  letter-spacing:.5px; padding:13px 14px; border-bottom:1.5px solid var(--gray-2); background:var(--gray-1);
  white-space:nowrap; position:sticky; top:0; cursor:pointer; user-select:none;
}
table.dt thead th:first-child { border-top-left-radius:var(--radius); }
table.dt thead th:last-child { border-top-right-radius:var(--radius); }
table.dt thead th .sort-ind { opacity:.4; margin-left:4px; font-size:10px; }
table.dt thead th.sorted .sort-ind { opacity:1; color:var(--teal); }
table.dt tbody td { padding:13px 14px; border-bottom:1px solid var(--gray-1); vertical-align:middle; }
table.dt tbody tr { transition:background .12s; cursor:pointer; }
table.dt tbody tr:hover { background:var(--gray-1); }
table.dt tbody tr:last-child td { border-bottom:none; }
.cell-name { font-weight:700; color:var(--text-main); }
.cell-sub { font-size:11.5px; color:var(--text-mute); }
.score-pill { font-weight:800; font-variant-numeric:tabular-nums; }

/* ─── BADGES / CHIPS ─── */
.badge { display:inline-flex; align-items:center; gap:5px; padding:4px 11px; border-radius:100px;
  font-size:11.5px; font-weight:700; white-space:nowrap; }
.badge .d { width:6px; height:6px; border-radius:50%; }
.b-gray   { background:var(--gray-1); color:var(--text-sub); }
.b-blue   { background:#e8edfd; color:var(--indigo); }
.b-teal   { background:#dcf5f3; color:var(--teal-dark); }
.b-amber  { background:#fdf0d9; color:#b9791a; }
.b-green  { background:#dcf3e7; color:#1d8a55; }
.b-red    { background:#fce4df; color:#c23a26; }
.b-purple { background:#eee3fb; color:#6f3fc0; }
.chip { display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:100px;
  font-size:12.5px; font-weight:600; background:#fff; border:1px solid var(--gray-2); color:var(--text-sub);
  cursor:pointer; transition:all .14s; }
.chip:hover { border-color:var(--gray-3); }
.chip.active { background:var(--navy); color:#fff; border-color:var(--navy); }
.chip .c { background:rgba(255,255,255,0.25); padding:0 7px; border-radius:100px; font-size:11px; }
.chip:not(.active) .c { background:var(--gray-1); color:var(--text-mute); }

/* ─── TOOLBAR ─── */
.toolbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
.toolbar .filters { display:flex; gap:8px; flex-wrap:wrap; }
.toolbar-spacer { flex:1; }
.mini-search { position:relative; }
.mini-search input { width:230px; padding:9px 13px 9px 35px; border:1px solid var(--gray-2); border-radius:10px; background:#fff; }
.mini-search input:focus { outline:none; border-color:var(--teal); box-shadow:0 0 0 3px rgba(0,169,157,0.12); }
.mini-search svg { position:absolute; left:11px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--gray-4); }
select.inp, input.inp, textarea.inp {
  padding:9px 13px; border:1px solid var(--gray-2); border-radius:10px; background:#fff; color:var(--text-main); }
select.inp:focus, input.inp:focus, textarea.inp:focus { outline:none; border-color:var(--teal); box-shadow:0 0 0 3px rgba(0,169,157,0.12); }

/* ─── AVATAR ─── */
.avatar { width:38px; height:38px; border-radius:50%; display:grid; place-items:center; font-weight:800;
  font-size:14px; color:#fff; flex-shrink:0; }
.avatar.lg { width:64px; height:64px; font-size:24px; }
.row-flex { display:flex; align-items:center; gap:11px; }

/* ─── DETAIL PAGE ─── */
.detail-grid { display:grid; grid-template-columns:340px 1fr; gap:20px; align-items:start; }
.profile-card { padding:0; overflow:hidden; position:sticky; top:90px; }
.profile-head { background:linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%); padding:26px 24px 22px; color:#fff; text-align:center; }
.profile-head .avatar { margin:0 auto 13px; box-shadow:0 6px 18px rgba(0,0,0,0.25); }
.profile-head h2 { font-size:21px; font-weight:800; }
.profile-head .p-sub { font-size:12.5px; color:rgba(255,255,255,0.6); margin-top:3px; }
.profile-head .p-track { margin-top:12px; }
.profile-body { padding:20px 22px; }
.info-row { display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px solid var(--gray-1); font-size:13px; }
.info-row:last-child { border-bottom:none; }
.info-row .k { color:var(--text-mute); font-weight:600; flex-shrink:0; }
.info-row .v { text-align:right; color:var(--text-main); font-weight:500; word-break:break-all; }
.flag-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:14px; }
.flag { display:flex; align-items:center; gap:7px; padding:9px 11px; border-radius:9px; background:var(--gray-1); font-size:12px; font-weight:600; }
.flag .fi { width:18px; height:18px; border-radius:5px; display:grid; place-items:center; color:#fff; flex-shrink:0; }
.flag .fi svg { width:12px; height:12px; }
.fi.y { background:var(--green); } .fi.n { background:var(--gray-4); } .fi.warn { background:var(--amber); }

.detail-main { display:flex; flex-direction:column; gap:18px; }
.essay-card { padding:24px 26px; }
.essay-card h3 { font-size:14.5px; font-weight:800; display:flex; align-items:center; gap:9px; margin-bottom:6px; }
.essay-card h3 .num { width:24px; height:24px; border-radius:7px; background:var(--navy); color:#fff; display:grid; place-items:center; font-size:12px; }
.essay-card .cnt { margin-left:auto; font-size:11.5px; color:var(--text-mute); font-weight:600; }
.essay-text { font-size:13.5px; color:var(--text-sub); white-space:pre-wrap; line-height:1.85; margin-top:10px;
  max-height:230px; overflow:hidden; position:relative; transition:max-height .3s; }
.essay-text.open { max-height:none; }
.essay-text:not(.open).clamped::after { content:''; position:absolute; bottom:0; left:0; right:0; height:60px;
  background:linear-gradient(transparent, #fff); }
.essay-more { font-size:12px; color:var(--teal-dark); font-weight:700; margin-top:8px; }

/* ─── EVAL PANEL ─── */
.eval-card { padding:0; overflow:hidden; }
.eval-head { display:flex; align-items:center; gap:12px; padding:18px 24px; border-bottom:1px solid var(--gray-2); }
.eval-head .ico { width:34px; height:34px; border-radius:9px; display:grid; place-items:center; color:#fff; }
.eval-head h3 { font-size:15px; font-weight:800; }
.eval-head .sub { font-size:12px; color:var(--text-mute); }
.eval-head .total-badge { margin-left:auto; text-align:right; }
.eval-head .total-badge .n { font-size:26px; font-weight:900; letter-spacing:-1px; }
.eval-head .total-badge .l { font-size:11px; color:var(--text-mute); font-weight:600; }
.eval-body { padding:8px 24px 20px; }
.crit { padding:16px 0; border-bottom:1px solid var(--gray-1); }
.crit:last-child { border-bottom:none; }
.crit-top { display:flex; align-items:center; gap:10px; margin-bottom:11px; }
.crit-name { font-size:13.5px; font-weight:700; }
.crit-name .tag { font-size:10px; font-weight:700; padding:2px 7px; border-radius:5px; margin-left:7px; vertical-align:middle; }
.tag-basic { background:#dcf5f3; color:var(--teal-dark); }
.tag-add   { background:#eee3fb; color:#6f3fc0; }
.crit-desc { font-size:11.5px; color:var(--text-mute); margin-top:1px; }
.crit-score { margin-left:auto; display:flex; align-items:center; gap:9px; }
.crit-score .sval { font-size:16px; font-weight:800; min-width:54px; text-align:right; font-variant-numeric:tabular-nums; }
.crit-score .sval small { font-size:12px; color:var(--text-mute); font-weight:600; }
.range-row { display:flex; align-items:center; gap:14px; }
input[type=range].slider { -webkit-appearance:none; appearance:none; flex:1; height:6px; border-radius:100px;
  background:var(--gray-2); outline:none; }
input[type=range].slider::-webkit-slider-thumb { -webkit-appearance:none; width:20px; height:20px; border-radius:50%;
  background:var(--teal); cursor:pointer; box-shadow:0 2px 6px rgba(0,122,115,0.4); border:3px solid #fff; }
input[type=range].slider::-moz-range-thumb { width:18px; height:18px; border-radius:50%; background:var(--teal);
  cursor:pointer; border:3px solid #fff; }
.eval-foot { padding:18px 24px; background:var(--gray-1); border-top:1px solid var(--gray-2); }
.eval-foot textarea { width:100%; min-height:72px; resize:vertical; margin-bottom:12px; }
.eval-foot .actions { display:flex; gap:10px; align-items:center; }
.eval-foot .meta { font-size:11.5px; color:var(--text-mute); }

.stage-strip { display:flex; align-items:center; gap:0; padding:4px; background:var(--gray-1); border-radius:12px; }
.stage-node { flex:1; text-align:center; padding:10px 6px; border-radius:9px; font-size:12px; font-weight:700;
  color:var(--text-mute); position:relative; }
.stage-node.done { color:var(--teal-dark); }
.stage-node.current { background:#fff; color:var(--navy); box-shadow:var(--shadow-sm); }
.stage-node.fail { color:var(--red); }
.stage-node .sn-step { font-size:9px; letter-spacing:1px; text-transform:uppercase; opacity:.6; display:block; }

/* ─── EMPTY / UPLOAD ─── */
.empty { text-align:center; padding:60px 20px; color:var(--text-mute); }
.empty svg { width:54px; height:54px; opacity:.4; margin-bottom:14px; }
.dropzone { border:2px dashed var(--gray-3); border-radius:var(--radius); padding:48px 30px; text-align:center;
  background:#fff; transition:all .18s; cursor:pointer; }
.dropzone.drag { border-color:var(--teal); background:#f0fbfa; }
.dropzone .dz-ico { width:60px; height:60px; border-radius:16px; background:#dcf5f3; color:var(--teal-dark);
  display:grid; place-items:center; margin:0 auto 16px; }
.dropzone .dz-ico svg { width:30px; height:30px; }
.dropzone h3 { font-size:17px; font-weight:800; }
.dropzone p { font-size:13px; color:var(--text-mute); margin-top:6px; }

/* ─── MODAL ─── */
.modal-overlay { position:fixed; inset:0; background:rgba(11,31,58,0.55); backdrop-filter:blur(3px); z-index:90;
  display:grid; place-items:center; padding:24px; opacity:0; pointer-events:none; transition:opacity .18s; }
.modal-overlay.show { opacity:1; pointer-events:auto; }
.modal { background:#fff; border-radius:var(--radius); box-shadow:var(--shadow-lg); width:100%; max-width:560px;
  max-height:88vh; overflow:auto; transform:translateY(12px); transition:transform .18s; }
.modal-overlay.show .modal { transform:none; }
.modal-head { padding:22px 26px 16px; border-bottom:1px solid var(--gray-2); display:flex; align-items:center; gap:12px; }
.modal-head h3 { font-size:17px; font-weight:800; }
.modal-head .x { margin-left:auto; width:32px; height:32px; border-radius:8px; display:grid; place-items:center; color:var(--text-mute); }
.modal-head .x:hover { background:var(--gray-1); }

    final_pass:     { key:'final_pass',     label:'최종합격',   step:'04 최종', badge:'b-green',  order:5 },
    final_fail:     { key:'final_fail',     label:'최종불합격', step:'04 최종', badge:'b-red',    order:5 },
  };
  const STAGE_ORDER = ['applied','doc_review','doc_pass','doc_fail','interview','interview_done','final_pass','final_fail'];

  /* ── 기본 평가 기준 (기본 항목 + 추가 항목) ──────────────── */
  const DEFAULT_CONFIG = {
    docCriteria: [
      { id:'d_motive', name:'지원동기 적합성',        max:25, kind:'basic', desc:'사업 목적·직무와의 연관성, 참여 의지의 진정성' },
      { id:'d_career', name:'관련 경력·경험',         max:25, kind:'basic', desc:'직무 관련 경력, 활동, 보유 역량의 충실도' },
      { id:'d_plan',   name:'수행계획 구체성',        max:25, kind:'basic', desc:'향후 비전·포부 및 수행계획의 구체성·실현 가능성' },
      { id:'d_growth', name:'성장 가능성',            max:15, kind:'basic', desc:'학습 태도, 발전 가능성, 잠재 역량' },
      { id:'d_doc',    name:'서류 충실도',            max:10, kind:'add',   desc:'첨부서류·기재 완성도, 적격요건 충족' },
    ],
    itvCriteria: [
      { id:'i_job',    name:'직무 이해도',            max:25, kind:'basic', desc:'직무·과제에 대한 이해와 전문성' },
      { id:'i_comm',   name:'의사소통 능력',          max:20, kind:'basic', desc:'논리적 전달력, 경청·표현력' },
      { id:'i_solve',  name:'문제해결·창의성',        max:20, kind:'basic', desc:'문제 정의 및 창의적 해결 역량' },
      { id:'i_atti',   name:'성실성·인성',            max:20, kind:'basic', desc:'책임감, 태도, 조직 적응력' },
      { id:'i_fit',    name:'조직 적합성·열정',       max:15, kind:'add',   desc:'기관 가치 부합도, 참여 열정' },
    ],
    docPassCut: 60,     // 서류 합격 기준 점수
    itvPassCut: 65,     // 최종 합격 기준 점수
    finalQuota: { '째깍섬':14, '키즈-째깍악어':5, '펫-모그와이':5 }, // 트랙별 최종 선발 인원
  };

  /* ── 상태 ──────────────────────────────────────────────── */
  let state = {
    applicants: [],
    evals: {},      // { [id]: { doc:{scores,total,comment,reviewer,date}, itv:{...} } }
    stages: {},     // { [id]: stageKey }
    config: null,
    meta: { uploadedName:'', uploadedAt:'', sourceTitle:'' },
  };

  function deepClone(o){ return JSON.parse(JSON.stringify(o)); }

  function load() {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      try {
        const parsed = JSON.parse(raw);
        state = Object.assign(state, parsed);
        if (!state.config) state.config = deepClone(DEFAULT_CONFIG);
        return;
      } catch (e) { console.warn('상태 복원 실패, 초기화', e); }
    }
    seedFromDefault();
  }

  function seedFromDefault() {
    const seed = (window.SEED_APPLICANTS || []).map(normalizeApplicant);
    state.applicants = seed;
    state.evals = {};
    state.stages = {};
    seed.forEach(a => state.stages[a.id] = 'applied');
    state.config = deepClone(DEFAULT_CONFIG);
    state.meta = { uploadedName:'통합신청자명단 (시드)', uploadedAt:new Date().toISOString(),
      sourceTitle:'2026 청년일경험지원사업 [커넥팅더닷츠]' };
    save();
  }

  function normalizeApplicant(a, i) {
    return {
      id: a.id || a.authNo || ('APP' + String(i+1).padStart(4,'0')),
      no: a.no || (i+1),
      track: a.track || '미분류',
      org: a.org || '', program: a.program || '',
      authNo: a.authNo || '', authStatus: a.authStatus || '',
      name: a.name || '(이름없음)',
      applyDate: a.applyDate || '', birth: a.birth || '',
      address: a.address || '', phone: a.phone || '', email: a.email || '',
      edu: a.edu || '', school: a.school || '', college: a.college || '', major: a.major || '',
      annualCount: a.annualCount || 0,
      kepa: a.kepa || '', employIns: a.employIns || '',
      privacyAgree: a.privacyAgree || '', dataIssue: a.dataIssue || '', hasFile: a.hasFile || '',
      motivation: a.motivation || '', vision: a.vision || '', career: a.career || '',
    };
  }

  function save() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); }
    catch (e) { console.error('저장 실패', e); }
  }

  /* ── 데이터 교체 (업로드) ──────────────────────────────── */
  function replaceApplicants(rows, meta) {
    const norm = rows.map(normalizeApplicant);
    state.applicants = norm;
    state.evals = {};
    state.stages = {};
    norm.forEach(a => state.stages[a.id] = 'applied');
    state.meta = Object.assign({ uploadedAt:new Date().toISOString() }, meta || {});
    save();
  }

  function resetAll() { localStorage.removeItem(LS_KEY); seedFromDefault(); }

  /* ── 조회 ──────────────────────────────────────────────── */
  const applicants = () => state.applicants;
  const getApplicant = id => state.applicants.find(a => a.id === id);
  const config = () => state.config;
  const meta = () => state.meta;
  const stageOf = id => state.stages[id] || 'applied';
  const stageInfo = key => STAGES[key] || STAGES.applied;
  const allStages = () => STAGES;

  function evalOf(id) {
    if (!state.evals[id]) state.evals[id] = { doc:null, itv:null };
    return state.evals[id];
  }

  /* ── 평가 저장 ─────────────────────────────────────────── */
  function totalOf(scores, criteria) {
    return criteria.reduce((s,c) => s + (Number(scores[c.id]) || 0), 0);
  }
  function maxTotal(criteria){ return criteria.reduce((s,c)=>s+c.max,0); }

  function saveDocEval(id, scores, comment, reviewer) {
    const total = totalOf(scores, state.config.docCriteria);
    const e = evalOf(id);
    e.doc = { scores:deepClone(scores), total, comment:comment||'', reviewer:reviewer||'심사위원',
              date:new Date().toISOString() };
    // 단계 전이: 신청완료 → 서류심사중
    const cur = stageOf(id);
    if (cur === 'applied') state.stages[id] = 'doc_review';
    save();
    return total;
  }

  function saveItvEval(id, scores, comment, reviewer) {
    const total = totalOf(scores, state.config.itvCriteria);
    const e = evalOf(id);
    e.itv = { scores:deepClone(scores), total, comment:comment||'', reviewer:reviewer||'심사위원',
              date:new Date().toISOString() };
    const cur = stageOf(id);
    if (cur === 'interview') state.stages[id] = 'interview_done';
    save();
    return total;
  }

  function setStage(id, stage) {
    if (!STAGES[stage]) return;
    state.stages[id] = stage;
    save();
  }

  /* ── 일괄 처리 ─────────────────────────────────────────── */
  // 서류 합격선 자동 적용: 점수 있는 신청자 중 cut 이상 합격 / 미만 불합격
  function applyDocCut() {
    const cut = state.config.docPassCut;
    let pass=0, fail=0;
    state.applicants.forEach(a => {
      const e = state.evals[a.id];
      if (e && e.doc) {
        if (['interview','interview_done','final_pass','final_fail'].includes(stageOf(a.id))) return;
        if (e.doc.total >= cut) { state.stages[a.id]='doc_pass'; pass++; }
        else { state.stages[a.id]='doc_fail'; fail++; }
      }
    });
    save();
    return { pass, fail };
  }

  // 서류합격자 → 인터뷰대상 일괄 승급
  function promoteToInterview(ids) {
    let n=0;
    ids.forEach(id => { if (stageOf(id)==='doc_pass'){ state.stages[id]='interview'; n++; } });
    save(); return n;
  }

  // 최종 선발: 트랙별 인터뷰 점수 순 + 쿼터 적용
  function applyFinalSelection() {
    const cut = state.config.itvPassCut;
    const quota = state.config.finalQuota;
    const byTrack = {};
    state.applicants.forEach(a => {
      const e = state.evals[a.id];
      const st = stageOf(a.id);
      if ((st==='interview_done'||st==='final_pass'||st==='final_fail') && e && e.itv) {
        (byTrack[a.track] = byTrack[a.track] || []).push({ id:a.id, total:e.itv.total });
      }
    });
    let pass=0, fail=0;
    Object.keys(byTrack).forEach(tr => {
      const list = byTrack[tr].sort((x,y)=>y.total-x.total);
      const q = quota[tr] != null ? quota[tr] : list.length;
      list.forEach((item, idx) => {
        if (idx < q && item.total >= cut) { state.stages[item.id]='final_pass'; pass++; }
        else { state.stages[item.id]='final_fail'; fail++; }
      });
    });
    save();
    return { pass, fail };
  }

  /* ── 설정 변경 ─────────────────────────────────────────── */
  function updateConfig(patch){ Object.assign(state.config, patch); save(); }
  function addCriterion(group, crit){
    crit.id = (group==='doc'?'d_':'i_') + 'x' + Date.now().toString(36);
    crit.kind = 'add';
    state.config[group==='doc'?'docCriteria':'itvCriteria'].push(crit);
    save(); return crit.id;
  }
  function removeCriterion(group, id){
    const k = group==='doc'?'docCriteria':'itvCriteria';
    state.config[k] = state.config[k].filter(c=>c.id!==id);
    save();
  }
  function updateCriterion(group, id, patch){
    const k = group==='doc'?'docCriteria':'itvCriteria';
    const c = state.config[k].find(x=>x.id===id);
    if (c) Object.assign(c, patch);
    save();
  }

  /* ── 통계 ──────────────────────────────────────────────── */
  function stats() {
    const apps = state.applicants;
    const total = apps.length;
    const cnt = k => apps.filter(a => stageOf(a.id)===k).length;
    const counts = {};
    STAGE_ORDER.forEach(k => counts[k] = cnt(k));

    // 퍼널 (누적)
    const reviewed   = apps.filter(a => state.evals[a.id]?.doc).length;
    const docPassed  = apps.filter(a => ['doc_pass','interview','interview_done','final_pass','final_fail'].includes(stageOf(a.id))).length;
    const interviewed= apps.filter(a => ['interview_done','final_pass','final_fail'].includes(stageOf(a.id))).length;
    const finalPass  = cnt('final_pass');

    // 트랙 분포
    const trackMap = {};
    apps.forEach(a => { trackMap[a.track] = (trackMap[a.track]||0)+1; });

    // 학력 분포
    const eduMap = {};
    apps.forEach(a => { const e=a.edu||'기타'; eduMap[e]=(eduMap[e]||0)+1; });

    // 서류 점수 분포 (구간)
    const buckets = [0,0,0,0,0]; // <60,60-69,70-79,80-89,90+
    const docScores = [];
    apps.forEach(a => {
      const e = state.evals[a.id];
      if (e?.doc) {
        const t = e.doc.total; docScores.push(t);
        if (t<60) buckets[0]++; else if (t<70) buckets[1]++; else if (t<80) buckets[2]++;
        else if (t<90) buckets[3]++; else buckets[4]++;
      }
    });
    const avgDoc = docScores.length ? (docScores.reduce((a,b)=>a+b,0)/docScores.length) : 0;

    // 적격 플래그
    const privacyY = apps.filter(a=>a.privacyAgree==='Y').length;
    const fileY    = apps.filter(a=>a.hasFile==='Y').length;
    const issueN   = apps.filter(a=>a.dataIssue==='N').length;

    return {
      total, counts, reviewed, docPassed, interviewed, finalPass, avgDoc,
      trackMap, eduMap, buckets, docScores, privacyY, fileY, issueN,
    };
  }

  // 트랙별 진행 요약
  function trackProgress() {
    const map = {};
    state.applicants.forEach(a => {
      const t = a.track;
      map[t] = map[t] || { track:t, total:0, reviewed:0, docPass:0, interview:0, finalPass:0 };
      map[t].total++;
      const e = state.evals[a.id]; const st = stageOf(a.id);
      if (e?.doc) map[t].reviewed++;
      if (['doc_pass','interview','interview_done','final_pass','final_fail'].includes(st)) map[t].docPass++;
      if (['interview','interview_done','final_pass','final_fail'].includes(st)) map[t].interview++;
      if (st==='final_pass') map[t].finalPass++;
    });
    return Object.values(map);
  }

  function recentActivity(n) {
    const acts = [];
    state.applicants.forEach(a => {
      const e = state.evals[a.id];
      if (e?.doc) acts.push({ id:a.id, name:a.name, track:a.track, type:'서류', total:e.doc.total, date:e.doc.date, reviewer:e.doc.reviewer });
      if (e?.itv) acts.push({ id:a.id, name:a.name, track:a.track, type:'인터뷰', total:e.itv.total, date:e.itv.date, reviewer:e.itv.reviewer });
    });
    return acts.sort((x,y)=> new Date(y.date)-new Date(x.date)).slice(0, n||8);
  }

  window.Store = {
    load, save, resetAll, replaceApplicants,
    applicants, getApplicant, config, meta,
    stageOf, stageInfo, allStages, STAGE_ORDER,
    evalOf, saveDocEval, saveItvEval, setStage,
    totalOf, maxTotal,
    applyDocCut, promoteToInterview, applyFinalSelection,
    updateConfig, addCriterion, removeCriterion, updateCriterion,
    stats, trackProgress, recentActivity,
    DEFAULT_CONFIG,
  };
})();

    t.innerHTML = (type==='ok'?ico('check'):type==='err'?ico('x'):ico('bolt')) + `<span>${esc(msg)}</span>`;
    $('#toasts').appendChild(t);
    setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300); }, 2600);
  }

  /* 모달 */
  function modal({ title, icon, iconBg, body, footer, onOpen }) {
    const root = $('#modalRoot');
    root.innerHTML = `<div class="modal">
      <div class="modal-head">
        ${icon?`<div style="width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:#fff;background:${iconBg||'var(--navy)'}">${ico(icon)}</div>`:''}
        <h3>${esc(title)}</h3>
        <button class="x" data-close>${ico('x')}</button>
      </div>
      <div class="modal-body">${body}</div>
      ${footer?`<div class="modal-foot">${footer}</div>`:''}
    </div>`;
    root.classList.add('show');
    root.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);
    root.onclick = e => { if(e.target===root) closeModal(); };
    if (onOpen) onOpen(root);
  }
  function closeModal(){ const r=$('#modalRoot'); r.classList.remove('show'); setTimeout(()=>r.innerHTML='',180); }

  /* 배지 */
  function stageBadge(key){ const s=S.stageInfo(key); return `<span class="badge ${s.badge}"><span class="d" style="background:currentColor"></span>${s.label}</span>`; }
  function trackBadge(t){ const c=trackColor(t); return `<span class="badge" style="background:${c}1a;color:${c}"><span class="d" style="background:${c}"></span>${esc(t)}</span>`; }

  /* ───────────────── 사이드바 ───────────────── */
  const NAV = [
    { group:'현황', items:[
      { route:'dashboard',  label:'대시보드',     icon:'dash' },
      { route:'applicants', label:'신청자 현황',  icon:'users', countKey:'total' },
    ]},
    { group:'선발 프로세스', items:[
      { route:'document',  label:'서류심사',   icon:'doc',    countKey:'docTodo' },
      { route:'interview', label:'인터뷰 심사', icon:'mic',    countKey:'itvTodo' },
      { route:'final',     label:'최종 선발',   icon:'trophy', countKey:'finalPass' },
    ]},
    { group:'관리', items:[
      { route:'upload',    label:'데이터 업로드', icon:'upload' },
      { route:'settings',  label:'평가·시스템 설정', icon:'gear' },

  function navCounts() {
    const apps = S.applicants();
    const docTodo = apps.filter(a=>['applied','doc_review'].includes(S.stageOf(a.id))).length;
    const itvTodo = apps.filter(a=>S.stageOf(a.id)==='interview').length;
    const st = S.stats();
    return { total: apps.length, docTodo, itvTodo, finalPass: st.finalPass };
  }

  function renderSidebar(active) {
    const c = navCounts();
    const groups = NAV.map(g => `
      <div class="sb-group-label">${g.group}</div>

        const cnt = it.countKey ? c[it.countKey] : null;
        return `<a class="sb-item ${active===it.route?'active':''}" href="#/${it.route}">
          ${ico(it.icon,'ico')}<span>${it.label}</span>
          ${cnt!=null && cnt>0 ? `<span class="badge-count">${cnt}</span>`:''}
        </a>`;
      }).join('')}

      <div class="sb-brand">
        <span class="sb-badge">Selection System</span>
        <div class="sb-title">청년일경험 <span>선발관리</span></div>

      </div>`;

  /* ───────────────── 라우터 ───────────────── */
  const routes = {};
  function route(name, fn){ routes[name]=fn; }
  function parseHash(){
    const h = (location.hash||'#/dashboard').slice(2);
    const [path, ...rest] = h.split('/');
    return { name: path||'dashboard', param: rest.join('/') };
  }
  function navigate(){
    const { name, param } = parseHash();
    const fn = routes[name] || routes.dashboard;
    renderSidebar(name);
    window.scrollTo(0,0);
    fn(param);
  }
  window.addEventListener('hashchange', navigate);

  function setTop(title, crumb, actions=''){
    $('#topbar').innerHTML = `
      <div><h1>${esc(title)}</h1><div class="crumb">${crumb||''}</div></div>
      <div class="topbar-spacer"></div>
      ${actions}`;
  }

  /* ════════════════════════════════════════════════════════
     VIEW: 대시보드
     ════════════════════════════════════════════════════════ */
  let charts = [];
  function destroyCharts(){ charts.forEach(c=>{try{c.destroy()}catch(e){}}); charts=[]; }

  route('dashboard', () => {
    destroyCharts();
    const st = S.stats();
    const m = S.meta();
    setTop('대시보드', `${esc(m.sourceTitle||'')} · 집계일 ${new Date().toLocaleDateString('ko-KR')}`,
      `<a class="btn btn-ghost" href="#/upload">${ico('upload')}데이터 업로드</a>

    const kpi = (label,icon,c,val,sub) => `

        <div class="kpi-val">${val}</div>
        <div class="kpi-meta">${sub}</div>
      </div>`;

    const docRate = st.total? Math.round(st.reviewed/st.total*100):0;
    const passRate = st.reviewed? Math.round(st.docPassed/st.reviewed*100):0;

    const kpis = `<div class="kpi-grid">
      ${kpi('총 신청자','users','#3B5BDB', st.total+'<small>명</small>', `${Object.keys(st.trackMap).length}개 트랙`)}
      ${kpi('서류심사 완료','doc','#00A99D', st.reviewed+'<small>명</small>', `진행률 <span class="up">${docRate}%</span>`)}
      ${kpi('서류 합격','check','#2BB673', st.docPassed+'<small>명</small>', `합격률 ${passRate}%`)}
      ${kpi('인터뷰 대상','mic','#F5A623', (st.counts.interview+st.counts.interview_done)+'<small>명</small>', `완료 ${st.interviewed}명`)}
      ${kpi('최종 합격','trophy','#8C5BE6', st.finalPass+'<small>명</small>', `평균 서류 ${st.avgDoc.toFixed(1)}점`)}
    </div>`;

    // 퍼널
    const steps = [
      { label:'신청 접수', n:st.total, c:'#3B5BDB' },
      { label:'서류심사', n:st.reviewed, c:'#00A99D' },
      { label:'서류합격', n:st.docPassed, c:'#2BB673' },
      { label:'인터뷰', n:st.interviewed, c:'#F5A623' },
      { label:'최종합격', n:st.finalPass, c:'#8C5BE6' },
    ];
    const funnel = `<div class="card" style="padding:6px 10px;margin-bottom:16px"><div class="funnel">
      ${steps.map((s,i)=>{ const prev=i?steps[i-1].n:s.n; const rate=prev?Math.round(s.n/steps[0].n*100):0;
        const wprev = i? (prev? Math.round(s.n/prev*100):0):100;
        return `<div class="funnel-step">
          <div class="funnel-num" style="color:${s.c}">${s.n}</div>
          <div class="funnel-label">${s.label}</div>
          <div class="funnel-rate">${i?`전환 ${wprev}% · `:''}전체 ${rate}%</div>
          <div class="funnel-bar"><i style="width:${rate}%;background:${s.c}"></i></div>
        </div>`; }).join('')}
    </div></div>`;

    // 차트 영역
    const chartsHtml = `
      <div class="chart-grid">
        <div class="card chart-card">
          <div class="chart-head"><div><div class="section-title"><span class="dot"></span>단계별 신청자 분포</div>
            <div class="section-sub">선발 프로세스 전 단계 현황</div></div></div>
          <div class="chart-wrap"><canvas id="cStage"></canvas></div>
        </div>
        <div class="card chart-card">
          <div class="chart-head"><div><div class="section-title"><span class="dot"></span>트랙별 신청 비율</div>
            <div class="section-sub">3개 프로그램 트랙</div></div></div>
          <div class="chart-wrap sm"><canvas id="cTrack"></canvas></div>
        </div>
      </div>
      <div class="chart-grid">
        <div class="card chart-card">
          <div class="chart-head"><div><div class="section-title"><span class="dot"></span>서류 점수 분포</div>
            <div class="section-sub">평가 완료 ${st.reviewed}명 · 평균 ${st.avgDoc.toFixed(1)}점 / 합격선 ${S.config().docPassCut}점</div></div></div>
          <div class="chart-wrap sm"><canvas id="cScore"></canvas></div>
        </div>
        <div class="card chart-card">
          <div class="chart-head"><div><div class="section-title"><span class="dot"></span>학력 분포</div>
            <div class="section-sub">신청자 최종 학력 기준</div></div></div>
          <div class="chart-wrap sm"><canvas id="cEdu"></canvas></div>
        </div>
      </div>`;

    // 트랙별 진행 + 최근 활동
    const tp = S.trackProgress();
    const trackTable = `<div class="card chart-card" style="margin-top:16px">
      <div class="section-title"><span class="dot"></span>트랙별 진행 현황</div>
      <div class="table-wrap" style="margin-top:14px"><table class="dt">
        <thead><tr><th style="cursor:default">트랙</th><th style="cursor:default">신청</th><th style="cursor:default">서류심사</th>
          <th style="cursor:default">서류합격</th><th style="cursor:default">인터뷰</th><th style="cursor:default">최종합격</th>
          <th style="cursor:default">진행도</th></tr></thead>
        <tbody>${tp.map(t=>{ const prog=t.total?Math.round((t.reviewed)/t.total*100):0;
          return `<tr style="cursor:default">
            <td>${trackBadge(t.track)}</td>
            <td><strong>${t.total}</strong>명</td>
            <td>${t.reviewed}</td><td>${t.docPass}</td><td>${t.interview}</td>
            <td><span class="score-pill" style="color:#8C5BE6">${t.finalPass}</span></td>
            <td><div style="display:flex;align-items:center;gap:9px"><div class="progress-mini"><i style="width:${prog}%;background:${trackColor(t.track)}"></i></div><span class="cell-sub">${prog}%</span></div></td>
          </tr>`; }).join('')}</tbody>
      </table></div></div>`;

    const acts = S.recentActivity(8);
    const recent = `<div class="card chart-card" style="margin-top:16px">
      <div class="section-title"><span class="dot"></span>최근 평가 활동</div>
      ${acts.length? `<div style="margin-top:8px">${acts.map(a=>`
        <div style="display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--gray-1)">
          <div class="avatar" style="width:34px;height:34px;font-size:12px;background:${avaColor(a.name)}">${esc(initials(a.name))}</div>
          <div style="flex:1;min-width:0">
            <div style="font-weight:700;font-size:13.5px">${esc(a.name)} <span class="badge ${a.type==='서류'?'b-teal':'b-purple'}" style="margin-left:4px">${a.type} 평가</span></div>
            <div class="cell-sub">${trackBadge(a.track)} · ${esc(a.reviewer)} · ${ago(a.date)}</div>
          </div>
          <div class="score-pill" style="font-size:17px;color:${scoreColor(a.total)}">${a.total}<small style="font-size:11px;color:var(--text-mute)">점</small></div>
          <a class="btn btn-ghost btn-sm" href="#/applicant/${a.id}">${ico('chevR')}</a>
        </div>`).join('')}</div>`
      : `<div class="empty">${ico('list')}<div>아직 평가 활동이 없습니다.<br>서류심사부터 시작해 보세요.</div></div>`}
    </div>`;

    $('#view').innerHTML = kpis + funnel + chartsHtml + `<div class="split-2" style="align-items:start">${trackTable}${recent}</div>`;

    // 차트 그리기
    const ds = st.counts;
    drawBar('cStage',
      ['신청완료','서류심사중','서류합격','서류불합격','인터뷰대상','인터뷰완료','최종합격','최종불합격'],
      [ds.applied,ds.doc_review,ds.doc_pass,ds.doc_fail,ds.interview,ds.interview_done,ds.final_pass,ds.final_fail],
      ['#9BA8BC','#3B5BDB','#00A99D','#E8503A','#F5A623','#8C5BE6','#2BB673','#c23a26']);
    drawDoughnut('cTrack', Object.keys(st.trackMap), Object.values(st.trackMap),
      Object.keys(st.trackMap).map(trackColor));
    drawBar('cScore', ['~59','60-69','70-79','80-89','90+'], st.buckets,
      ['#E8503A','#F5A623','#00A99D','#4EC9C3','#2BB673']);
    drawDoughnut('cEdu', Object.keys(st.eduMap), Object.values(st.eduMap),
      ['#3B5BDB','#00A99D','#F5A623','#8C5BE6','#E8503A','#2BB673','#748FFC'], true);
  });

  function drawBar(id, labels, data, colors){
    const ctx = $('#'+id); if(!ctx) return;
    charts.push(new Chart(ctx, { type:'bar', data:{ labels, datasets:[{ data, backgroundColor:colors, borderRadius:7, maxBarThickness:46 }]},
      options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{display:false} },
        scales:{ x:{ grid:{display:false}, ticks:{ font:{family:'Noto Sans KR',size:11}, color:'#5A6A82' } },
          y:{ beginAtZero:true, grid:{color:'#F0F3F8'}, ticks:{ precision:0, font:{size:11}, color:'#8A98AE' } } } } }));
  }
  function drawDoughnut(id, labels, data, colors, legendRight){
    const ctx = $('#'+id); if(!ctx) return;
    charts.push(new Chart(ctx, { type:'doughnut', data:{ labels, datasets:[{ data, backgroundColor:colors, borderWidth:3, borderColor:'#fff' }]},
      options:{ responsive:true, maintainAspectRatio:false, cutout:'62%',
        plugins:{ legend:{ position: legendRight?'right':'bottom', labels:{ font:{family:'Noto Sans KR',size:11.5}, color:'#5A6A82', padding:12, usePointStyle:true, pointStyle:'circle', boxWidth:8 } } } } }));
  }

  /* ════════════════════════════════════════════════════════
     VIEW: 신청자 현황 (목록)
     ════════════════════════════════════════════════════════ */
  let listState = { q:'', track:'all', stage:'all', sort:'no', dir:1 };
  route('applicants', () => {
    destroyCharts();
    setTop('신청자 현황', '전체 신청자 명단 · 필터/정렬/검색',
      `<a class="btn btn-ghost" href="#/document">${ico('doc')}서류심사로</a>`);
    renderApplicantList();
  });

  function filteredApplicants(){
    let list = S.applicants().slice();
    const { q, track, stage } = listState;
    if (track!=='all') list = list.filter(a=>a.track===track);
    if (stage!=='all') list = list.filter(a=>S.stageOf(a.id)===stage);
    if (q.trim()){ const t=q.trim().toLowerCase();
      list = list.filter(a => [a.name,a.school,a.major,a.email,a.phone,a.authNo].some(v=>String(v).toLowerCase().includes(t))); }
    const { sort, dir } = listState;
    list.sort((a,b)=>{
      let va,vb;
      if (sort==='no'){ va=a.no; vb=b.no; }
      else if (sort==='name'){ va=a.name; vb=b.name; }
      else if (sort==='track'){ va=a.track; vb=b.track; }
      else if (sort==='stage'){ va=S.stageInfo(S.stageOf(a.id)).order; vb=S.stageInfo(S.stageOf(b.id)).order; }
      else if (sort==='doc'){ va=S.evalOf(a.id).doc?.total??-1; vb=S.evalOf(b.id).doc?.total??-1; }
      if (va<vb) return -1*dir; if (va>vb) return 1*dir; return 0;
    });
    return list;
  }

  function renderApplicantList(){
    const tracks = [...new Set(S.applicants().map(a=>a.track))];
    const trackCounts = {}; S.applicants().forEach(a=>trackCounts[a.track]=(trackCounts[a.track]||0)+1);
    const stagesAll = S.allStages();
    const stageCount = k => S.applicants().filter(a=>S.stageOf(a.id)===k).length;

    const trackChips = `<div class="filters">
      <button class="chip ${listState.track==='all'?'active':''}" data-track="all">전체 <span class="c">${S.applicants().length}</span></button>
      ${tracks.map(t=>`<button class="chip ${listState.track===t?'active':''}" data-track="${esc(t)}">${esc(t)} <span class="c">${trackCounts[t]}</span></button>`).join('')}
    </div>`;

    const list = filteredApplicants();
    const arrow = key => listState.sort===key ? (listState.dir>0?'▲':'▼') : '↕';
    const th = (key,label,style='') => `<th class="${listState.sort===key?'sorted':''}" data-sort="${key}" style="${style}">${label}<span class="sort-ind">${arrow(key)}</span></th>`;

    const stageOpts = ['all',...S.STAGE_ORDER].map(k=>{
      const lbl = k==='all'?'전체 단계':S.stageInfo(k).label;
      const cnt = k==='all'?'':` (${stageCount(k)})`;
      return `<option value="${k}" ${listState.stage===k?'selected':''}>${lbl}${cnt}</option>`;
    }).join('');

    $('#view').innerHTML = `
      <div class="toolbar">
        ${trackChips}
        <div class="toolbar-spacer"></div>
        <select class="inp" id="stageFilter">${stageOpts}</select>
        <div class="mini-search">${ico('search')}<input id="listSearch" placeholder="이름·학교·전공·연락처 검색" value="${esc(listState.q)}"></div>
      </div>
      <div class="card">
        <div class="table-wrap"><table class="dt">
          <thead><tr>
            ${th('no','연번','width:60px')}
            ${th('name','신청자')}
            ${th('track','트랙')}
            <th style="cursor:default">학력 · 학교</th>
            <th style="cursor:default">연락처</th>
            <th style="cursor:default">적격</th>
            ${th('doc','서류점수')}
            ${th('stage','단계')}
            <th style="cursor:default"></th>
          </tr></thead>
          <tbody>
            ${list.length? list.map(rowHtml).join('') : `<tr><td colspan="9"><div class="empty">${ico('search')}<div>조건에 맞는 신청자가 없습니다.</div></div></td></tr>`}
          </tbody>
        </table></div>
      </div>
      <div class="kpi-meta" style="margin-top:12px;justify-content:flex-end">${list.length}명 표시 / 전체 ${S.applicants().length}명</div>`;

    // 이벤트
    $$('#view .chip[data-track]').forEach(c=>c.onclick=()=>{ listState.track=c.dataset.track; renderApplicantList(); });
    $('#stageFilter').onchange = e => { listState.stage=e.target.value; renderApplicantList(); };
    const si = $('#listSearch'); si.oninput = e => { listState.q=e.target.value; clearTimeout(si._t); si._t=setTimeout(renderApplicantList,180); };
    si.focus(); si.setSelectionRange(si.value.length,si.value.length);
    $$('#view th[data-sort]').forEach(h=>h.onclick=()=>{ const k=h.dataset.sort;
      if(listState.sort===k) listState.dir*=-1; else { listState.sort=k; listState.dir=1; } renderApplicantList(); });
    $$('#view tbody tr[data-id]').forEach(tr=>tr.onclick=()=>{ location.hash='#/applicant/'+tr.dataset.id; });
  }

  function flagDot(val, type){ // type: agree(Y good) / issue(N good)
    const good = type==='issue' ? val==='N' : val==='Y';
    return `<span class="badge ${good?'b-green':'b-gray'}" style="padding:2px 8px;font-size:10.5px">${good?'O':(val==='Y'?'Y':'N')}</span>`;
  }

  function rowHtml(a){
    const doc = S.evalOf(a.id).doc;
    const docCell = doc ? `<span class="score-pill" style="color:${scoreColor(doc.total)}">${doc.total}<small style="font-size:10px;color:var(--text-mute)"> /${S.maxTotal(S.config().docCriteria)}</small></span>` : `<span class="muted">–</span>`;
    return `<tr data-id="${a.id}">
      <td class="cell-sub">${a.no}</td>
      <td><div class="row-flex">
        <div class="avatar" style="width:32px;height:32px;font-size:12px;background:${avaColor(a.name)}">${esc(initials(a.name))}</div>
        <div><div class="cell-name">${esc(a.name)}</div><div class="cell-sub">${esc(a.edu)}</div></div>
      </div></td>
      <td>${trackBadge(a.track)}</td>
      <td><div style="font-size:13px">${esc(a.school||'-')}</div><div class="cell-sub">${esc(a.major||a.college||'-')}</div></td>
      <td><div class="cell-sub">${esc(a.phone)}</div></td>
      <td><div style="display:flex;gap:3px" title="개인정보동의 / 첨부 / 이상없음">${flagDot(a.privacyAgree)} ${flagDot(a.hasFile)} ${flagDot(a.dataIssue,'issue')}</div></td>
      <td>${docCell}</td>
      <td>${stageBadge(S.stageOf(a.id))}</td>
      <td>${ico('chevR','')}</td>
    </tr>`;
  }

  /* ════════════════════════════════════════════════════════
     VIEW: 신청자 상세
     ════════════════════════════════════════════════════════ */
  route('applicant', (id) => {
    destroyCharts();
    const a = S.getApplicant(id);
    if (!a){ $('#view').innerHTML=`<div class="empty">${ico('user')}<div>신청자를 찾을 수 없습니다.</div></div>`; setTop('신청자 상세',''); return; }
    const list = filteredApplicants();
    const idx = list.findIndex(x=>x.id===id);
    const prev = idx>0?list[idx-1]:null, next = idx>=0&&idx<list.length-1?list[idx+1]:null;
    setTop(a.name+' 신청자', `${esc(a.program)}`,
      `${prev?`<a class="btn btn-ghost btn-sm" href="#/applicant/${prev.id}">${ico('chevL')}이전</a>`:''}
       ${next?`<a class="btn btn-ghost btn-sm" href="#/applicant/${next.id}">다음${ico('chevR')}</a>`:''}
       <a class="btn btn-ghost" href="#/applicants">${ico('list')}목록</a>`);
    renderDetail(a);
  });

  function renderDetail(a){
    const stg = S.stageOf(a.id);
    const ev = S.evalOf(a.id);
    const cfg = S.config();

    // 단계 스트립 (4단계 시각화)
    const stripNodes = [
      { keys:['applied'],                          label:'신청접수', step:'01', maxOrder:0 },
      { keys:['doc_review','doc_pass','doc_fail'], label:'서류심사', step:'02', maxOrder:2 },
      { keys:['interview','interview_done'],       label:'인터뷰',   step:'03', maxOrder:4 },
      { keys:['final_pass','final_fail'],          label:'최종선발', step:'04', maxOrder:5 },
    ];
    const curOrder = S.stageInfo(stg).order;
    const strip = `<div class="stage-strip">${stripNodes.map(n=>{
      const inThis = n.keys.includes(stg);
      const isFail = stg==='doc_fail'||stg==='final_fail';
      let cls = '';
      if (inThis) cls = 'current' + (isFail?' fail':'');
      else if (curOrder > n.maxOrder) cls = 'done';
      return `<div class="stage-node ${cls}"><span class="sn-step">${n.step}</span>${n.label}</div>`;
    }).join('')}</div>`;

    // 적격 플래그
    const flag = (label,val,good) => `<div class="flag"><span class="fi ${good?'y':'n'}">${good?ico('check'):ico('x')}</span>${label}</div>`;
    const flags = `<div class="flag-grid">
      ${flag('개인정보 동의', a.privacyAgree, a.privacyAgree==='Y')}
      ${flag('첨부파일', a.hasFile, a.hasFile==='Y')}
      ${flag('기재 이상없음', a.dataIssue, a.dataIssue==='N')}
      ${flag('인증상태', a.authStatus, a.authStatus==='완료'||a.authStatus==='인증')}
    </div>`;

    const profile = `<div class="card profile-card">
      <div class="profile-head">
        <div class="avatar lg" style="background:${avaColor(a.name)}">${esc(initials(a.name))}</div>
        <h2>${esc(a.name)}</h2>
        <div class="p-sub">${esc(a.birth)} · 연번 ${a.no}</div>
        <div class="p-track">${trackBadge(a.track)}</div>
        <div style="margin-top:10px">${stageBadge(stg)}</div>
      </div>
      <div class="profile-body">
        <div class="info-row"><span class="k">인증번호</span><span class="v">${esc(a.authNo||'-')}</span></div>
        <div class="info-row"><span class="k">신청일자</span><span class="v">${esc(a.applyDate||'-')}</span></div>
        <div class="info-row"><span class="k">학력</span><span class="v">${esc(a.edu||'-')}</span></div>
        <div class="info-row"><span class="k">학교</span><span class="v">${esc(a.school||'-')}</span></div>
        <div class="info-row"><span class="k">학과</span><span class="v">${esc(a.major||a.college||'-')}</span></div>
        <div class="info-row"><span class="k">${ico('phone')} 연락처</span><span class="v">${esc(a.phone||'-')}</span></div>
        <div class="info-row"><span class="k">${ico('mail')} 이메일</span><span class="v">${esc(a.email||'-')}</span></div>
        <div class="info-row"><span class="k">${ico('pin')} 주소</span><span class="v">${esc(a.address||'-')}</span></div>
        <div class="info-row"><span class="k">국취제 / 고용보험</span><span class="v">${esc(a.kepa||'-')} / ${esc(a.employIns||'-')}</span></div>
        ${flags}
      </div>
    </div>`;

    // 에세이
    const essay = (num,title,text) => `<div class="card essay-card">
      <h3><span class="num">${num}</span>${title}<span class="cnt">${(text||'').length.toLocaleString()}자</span></h3>
      <div class="essay-text" data-essay>${text?nl2br(text):'<span class="muted">작성 내용 없음</span>'}</div>
      ${ (text||'').length>320 ? `<div class="essay-more" data-more>전체 보기 ${ico('chevR')}</div>`:''}
    </div>`;

    const essays = essay(1,'지원동기',a.motivation) + essay(2,'향후 비전 및 포부 (수행계획)',a.vision) + essay(3,'관련 경력 · 경험',a.career);

    // 평가 패널
    const docPanel = evalPanelHtml('doc','서류 심사', 'doc', '#00A99D', cfg.docCriteria, ev.doc, stg);
    const showItv = ['interview','interview_done','final_pass','final_fail'].includes(stg);
    const itvPanel = showItv ? evalPanelHtml('itv','인터뷰 심사','mic','#8C5BE6', cfg.itvCriteria, ev.itv, stg)
      : `<div class="card" style="padding:20px 24px"><div class="note">${ico('mic')} 인터뷰 심사는 <strong>인터뷰 대상자로 선정된 후</strong> 진행할 수 있습니다. 서류 합격 처리 후 ‘인터뷰 심사’ 메뉴에서 대상자로 승급하세요.</div></div>`;

    // 단계 제어
    const controls = stageControlsHtml(stg, a);

    $('#view').innerHTML = `
      <div style="margin-bottom:16px">${strip}</div>
      <div class="detail-grid">
        <div>${profile}</div>
        <div class="detail-main">
          ${controls}
          ${docPanel}
          ${itvPanel}
          ${essays}
        </div>
      </div>`;

    // 에세이 더보기
    $$('#view [data-more]').forEach(b=>{ const txt=b.previousElementSibling; txt.classList.add('clamped');
      b.onclick=()=>{ txt.classList.toggle('open'); b.innerHTML = txt.classList.contains('open')?`접기 ${ico('chevL')}`:`전체 보기 ${ico('chevR')}`; }; });
    $$('#view .essay-text').forEach(t=>{ if(t.scrollHeight>t.clientHeight+5) t.classList.add('clamped'); });

    bindEvalPanel('doc', a, cfg.docCriteria);
    if (showItv) bindEvalPanel('itv', a, cfg.itvCriteria);
    bindStageControls(a);
  }

  function evalPanelHtml(key, title, icon, color, criteria, saved, stg){
    const scores = saved? saved.scores : {};
    const total = saved? saved.total : 0;
    const maxT = criteria.reduce((s,c)=>s+c.max,0);
    const crits = criteria.map(c=>{
      const v = scores[c.id] ?? 0;
      return `<div class="crit">
        <div class="crit-top">
          <div><div class="crit-name">${esc(c.name)}<span class="tag ${c.kind==='basic'?'tag-basic':'tag-add'}">${c.kind==='basic'?'기본':'추가'}</span></div>
            <div class="crit-desc">${esc(c.desc||'')}</div></div>
          <div class="crit-score"><span class="sval" data-sval="${c.id}" style="color:${scoreColor(v,c.max)}">${v}<small>/${c.max}</small></span></div>
        </div>
        <div class="range-row">
          <input type="range" class="slider" data-crit="${c.id}" min="0" max="${c.max}" step="1" value="${v}">
        </div>
      </div>`;
    }).join('');
    return `<div class="card eval-card" data-eval="${key}">
      <div class="eval-head">
        <div class="ico" style="background:${color}">${ico(icon)}</div>
        <div><h3>${title}</h3><div class="sub">기본 ${criteria.filter(c=>c.kind==='basic').length}항목 + 추가 ${criteria.filter(c=>c.kind==='add').length}항목 · 만점 ${maxT}점</div></div>
        <div class="total-badge"><div class="n" data-total style="color:${scoreColor(total,maxT)}">${total}</div><div class="l">/ ${maxT}점</div></div>
      </div>
      <div class="eval-body">${crits}</div>
      <div class="eval-foot">
        <textarea class="inp" data-comment placeholder="심사 의견 / 코멘트를 입력하세요 (선택)">${saved?esc(saved.comment):''}</textarea>
        <div class="actions">
          <input class="inp" data-reviewer placeholder="심사위원명" value="${saved?esc(saved.reviewer):''}" style="width:140px">
          <button class="btn btn-primary" data-save>${ico('check')}평가 저장</button>
          <span class="meta" data-savemeta>${saved?`최종 저장 ${ago(saved.date)} · ${esc(saved.reviewer)}`:'미평가'}</span>
        </div>
      </div>
    </div>`;
  }

  function bindEvalPanel(key, a, criteria){
    const root = $(`#view .eval-card[data-eval="${key}"]`); if(!root) return;
    const maxT = criteria.reduce((s,c)=>s+c.max,0);
    const recalc = () => {
      let total=0;
      criteria.forEach(c=>{
        const sl = root.querySelector(`[data-crit="${c.id}"]`); const v=Number(sl.value); total+=v;
        const sv = root.querySelector(`[data-sval="${c.id}"]`); sv.innerHTML=`${v}<small>/${c.max}</small>`; sv.style.color=scoreColor(v,c.max);
      });
      const tEl = root.querySelector('[data-total]'); tEl.textContent=total; tEl.style.color=scoreColor(total,maxT);
    };
    root.querySelectorAll('[data-crit]').forEach(sl=>sl.oninput=recalc);
    root.querySelector('[data-save]').onclick = () => {
      const scores={}; criteria.forEach(c=>scores[c.id]=Number(root.querySelector(`[data-crit="${c.id}"]`).value));
      const comment=root.querySelector('[data-comment]').value;
      const reviewer=root.querySelector('[data-reviewer]').value.trim()||'심사위원';
      const total = key==='doc'? S.saveDocEval(a.id,scores,comment,reviewer) : S.saveItvEval(a.id,scores,comment,reviewer);
      toast(`${key==='doc'?'서류':'인터뷰'} 평가 저장 완료 — ${total}점`,'ok');
      navigate(); // 단계/배지 갱신 반영
    };
  }

  function stageControlsHtml(stg, a){
    let btns = '';
    if (stg==='applied' || stg==='doc_review'){
      const ev=S.evalOf(a.id);
      const cut=S.config().docPassCut;
      btns = `<button class="btn btn-primary" data-act="doc_pass">${ico('check')}서류 합격</button>
              <button class="btn btn-danger" data-act="doc_fail">서류 불합격</button>
              ${ev.doc?`<span class="meta muted" style="font-size:12px">서류 ${ev.doc.total}점 / 합격선 ${cut}점</span>`:'<span class="meta muted" style="font-size:12px">먼저 서류 평가를 저장하세요</span>'}`;
    } else if (stg==='doc_pass'){
      btns = `<button class="btn btn-navy" data-act="interview">${ico('mic')}인터뷰 대상 선정</button>
              <button class="btn btn-ghost" data-act="doc_review">서류 재심사</button>`;
    } else if (stg==='doc_fail'){
      btns = `<button class="btn btn-ghost" data-act="doc_review">서류 재심사로 되돌리기</button>`;
    } else if (stg==='interview'){
      const ev=S.evalOf(a.id);
      btns = `<button class="btn btn-primary" data-act="final_pass">${ico('trophy')}최종 합격</button>
              <button class="btn btn-danger" data-act="final_fail">최종 불합격</button>
              <button class="btn btn-ghost" data-act="doc_pass">인터뷰 취소</button>
              ${ev.itv?`<span class="meta muted" style="font-size:12px">인터뷰 ${ev.itv.total}점</span>`:''}`;
    } else if (stg==='interview_done'){
      const ev=S.evalOf(a.id);
      btns = `<button class="btn btn-primary" data-act="final_pass">${ico('trophy')}최종 합격</button>
              <button class="btn btn-danger" data-act="final_fail">최종 불합격</button>
              ${ev.itv?`<span class="meta muted" style="font-size:12px">인터뷰 ${ev.itv.total}점</span>`:''}`;
    } else if (stg==='final_pass'){
      btns = `<span class="badge b-green" style="font-size:13px;padding:7px 14px">${ico('trophy')} 최종 합격자</span>
              <button class="btn btn-ghost" data-act="interview_done">선발 취소</button>`;
    } else if (stg==='final_fail'){
      btns = `<button class="btn btn-ghost" data-act="interview_done">최종심사로 되돌리기</button>`;
    }
    return `<div class="card" style="padding:16px 22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <span class="section-title" style="font-size:13.5px"><span class="dot"></span>단계 처리</span>
      <div style="flex:1"></div>${btns}</div>`;
  }

  function bindStageControls(a){
    $$('#view [data-act]').forEach(b=>b.onclick=()=>{ S.setStage(a.id, b.dataset.act);
      toast(`단계 변경: ${S.stageInfo(b.dataset.act).label}`,'ok'); navigate(); });
  }

  /* ════════════════════════════════════════════════════════
     VIEW: 인터뷰 심사

  route('interview', () => {
    destroyCharts();
    setTop('인터뷰 심사', '서류 합격자 인터뷰 대상 선정 · 인터뷰 평가',
      `<button class="btn btn-ghost" id="btnPromote">${ico('arrow')}서류합격자 일괄 승급</button>`);
    renderProcess('itv');
    $('#btnPromote').onclick = () => {
      const docPass = S.applicants().filter(a=>S.stageOf(a.id)==='doc_pass');

          <div style="margin-top:12px;max-height:240px;overflow:auto">${docPass.map(a=>`<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--gray-1)"><div class="avatar" style="width:28px;height:28px;font-size:11px;background:${avaColor(a.name)}">${esc(initials(a.name))}</div><strong style="font-size:13px">${esc(a.name)}</strong> ${trackBadge(a.track)} <span class="score-pill" style="margin-left:auto;color:${scoreColor(S.evalOf(a.id).doc?.total||0)}">${S.evalOf(a.id).doc?.total||'-'}점</span></div>`).join('')}</div>`,
        footer:`<button class="btn btn-ghost" data-close>취소</button><button class="btn btn-primary" id="doProm">${ico('check')}${docPass.length}명 승급</button>`,
        onOpen:r=>{ r.querySelector('#doProm').onclick=()=>{ const n=S.promoteToInterview(docPass.map(a=>a.id)); closeModal();
          toast(`${n}명 인터뷰 대상 승급 완료`,'ok'); renderProcess('itv'); renderSidebar('interview'); }; } });
    };
  });

  // 공통 프로세스 목록 (서류 / 인터뷰)
  let procTrack = 'all';
  function renderProcess(mode){
    const isDoc = mode==='doc';
    const cfg = S.config();
    const criteria = isDoc?cfg.docCriteria:cfg.itvCriteria;
    const maxT = criteria.reduce((s,c)=>s+c.max,0);
    // 대상 단계
    const pool = S.applicants().filter(a=>{
      const st=S.stageOf(a.id);
      return isDoc ? ['applied','doc_review','doc_pass','doc_fail'].includes(st)
                   : ['interview','interview_done','final_pass','final_fail'].includes(st);
    });
    const tracks=[...new Set(S.applicants().map(a=>a.track))];
    let list = procTrack==='all'?pool:pool.filter(a=>a.track===procTrack);

    // 진행 요약 미니 KPI
    const todo = pool.filter(a=>{ const st=S.stageOf(a.id); return isDoc?['applied','doc_review'].includes(st):st==='interview'; }).length;
    const done = pool.filter(a=>S.evalOf(a.id)[isDoc?'doc':'itv']).length;
    const scored = pool.map(a=>S.evalOf(a.id)[isDoc?'doc':'itv']).filter(Boolean);
    const avg = scored.length? (scored.reduce((s,e)=>s+e.total,0)/scored.length):0;

    const stat = (l,v,c)=>`<div class="kpi" style="--c:${c}"><div class="kpi-label">${l}</div><div class="kpi-val" style="font-size:28px">${v}</div></div>`;
    const stats = `<div class="kpi-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:18px">
      ${stat('대상 인원', pool.length+'명','#3B5BDB')}
      ${stat(isDoc?'평가 대기':'인터뷰 대기', todo+'명','#F5A623')}
      ${stat('평가 완료', done+'명','#00A99D')}
      ${stat('평균 점수', avg.toFixed(1)+'점','#8C5BE6')}
    </div>`;

    const chips = `<div class="filters">
      <button class="chip ${procTrack==='all'?'active':''}" data-ptrack="all">전체 <span class="c">${pool.length}</span></button>
      ${tracks.map(t=>{ const c=pool.filter(a=>a.track===t).length; return c?`<button class="chip ${procTrack===t?'active':''}" data-ptrack="${esc(t)}">${esc(t)} <span class="c">${c}</span></button>`:''; }).join('')}
    </div>`;

    // 정렬: 점수 높은 순 (평가된 것 우선)
    list.sort((a,b)=>{ const ea=S.evalOf(a.id)[isDoc?'doc':'itv'], eb=S.evalOf(b.id)[isDoc?'doc':'itv'];
      return (eb?.total??-1)-(ea?.total??-1) || a.no-b.no; });

    const rows = list.map(a=>{
      const ev = S.evalOf(a.id)[isDoc?'doc':'itv'];
      const st = S.stageOf(a.id);
      const scoreCell = ev? `<span class="score-pill" style="color:${scoreColor(ev.total,maxT)}">${ev.total}<small style="font-size:10px;color:var(--text-mute)"> /${maxT}</small></span>` : '<span class="muted">미평가</span>';
      return `<tr data-id="${a.id}">
        <td><div class="row-flex"><div class="avatar" style="width:32px;height:32px;font-size:12px;background:${avaColor(a.name)}">${esc(initials(a.name))}</div>
          <div><div class="cell-name">${esc(a.name)}</div><div class="cell-sub">${esc(a.school||'')} ${esc(a.major||'')}</div></div></div></td>
        <td>${trackBadge(a.track)}</td>
        <td>${scoreCell}</td>
        <td>${ev?`<div class="progress-mini"><i style="width:${ev.total/maxT*100}%;background:${scoreColor(ev.total,maxT)}"></i></div>`:''}</td>
        <td>${stageBadge(st)}</td>
        <td>${ev?`<span class="cell-sub">${esc(ev.reviewer)} · ${ago(ev.date)}</span>`:''}</td>
        <td><a class="btn btn-primary btn-sm" href="#/applicant/${a.id}">${ev?'평가 보기':'평가하기'}${ico('chevR')}</a></td>
      </tr>`;
    }).join('');

    $('#view').innerHTML = stats + `
      <div class="toolbar">${chips}</div>
      <div class="card"><div class="table-wrap"><table class="dt">
        <thead><tr><th style="cursor:default">신청자</th><th style="cursor:default">트랙</th><th style="cursor:default">${isDoc?'서류':'인터뷰'} 점수</th>

  function renderFinal(){
    const cfg = S.config();
    const maxT = cfg.itvCriteria.reduce((s,c)=>s+c.max,0);
    const tracks=[...new Set(S.applicants().map(a=>a.track))];
    const st = S.stats();

    const stat=(l,v,c)=>`<div class="kpi" style="--c:${c}"><div class="kpi-label">${l}</div><div class="kpi-val" style="font-size:28px">${v}</div></div>`;
    const totalQuota = Object.values(cfg.finalQuota).reduce((a,b)=>a+(b||0),0);
    const stats=`<div class="kpi-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:18px">
      ${stat('인터뷰 완료', st.interviewed+'명','#3B5BDB')}
      ${stat('총 선발 정원', totalQuota+'명','#F5A623')}
      ${stat('최종 합격', st.finalPass+'명','#2BB673')}
      ${stat('합격 기준', cfg.itvPassCut+'점','#8C5BE6')}
    </div>`;

    const blocks = tracks.map(tr=>{
      const cands = S.applicants().filter(a=>a.track===tr && ['interview','interview_done','final_pass','final_fail'].includes(S.stageOf(a.id)))
        .map(a=>({a, ev:S.evalOf(a.id).itv}))
        .sort((x,y)=>(y.ev?.total??-1)-(x.ev?.total??-1));
      const quota = cfg.finalQuota[tr] ?? '-';
      const passed = cands.filter(c=>S.stageOf(c.a.id)==='final_pass').length;
      const rows = cands.map((c,i)=>{
        const stg=S.stageOf(c.a.id);
        const rank = i+1;
        const rcls = stg==='final_pass'?(rank<=3?`rank-${rank}`:'rank-x'):'rank-x';
        return `<tr data-id="${c.a.id}">
          <td><span class="rank-badge ${rcls}">${rank}</span></td>
          <td><div class="row-flex"><div class="avatar" style="width:30px;height:30px;font-size:11px;background:${avaColor(c.a.name)}">${esc(initials(c.a.name))}</div><div class="cell-name">${esc(c.a.name)}</div></div></td>
          <td>${c.ev?`<span class="score-pill" style="color:${scoreColor(c.ev.total,maxT)}">${c.ev.total}<small style="color:var(--text-mute);font-size:10px"> /${maxT}</small></span>`:'<span class="muted">미평가</span>'}</td>
          <td>${stageBadge(stg)}</td>
          <td><a class="btn btn-ghost btn-sm" href="#/applicant/${c.a.id}">상세${ico('chevR')}</a></td>
        </tr>`;
      }).join('');
      return `<div class="card chart-card">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
          <div class="section-title">${trackBadge(tr)}</div>
          <div style="flex:1"></div>
          <span class="badge b-green">합격 ${passed} / 정원 ${quota}</span>
        </div>
        <div class="table-wrap" style="margin-top:8px"><table class="dt">
          <thead><tr><th style="cursor:default;width:50px">순위</th><th style="cursor:default">신청자</th><th style="cursor:default">인터뷰 점수</th><th style="cursor:default">결과</th><th style="cursor:default"></th></tr></thead>
          <tbody>${cands.length?rows:`<tr><td colspan="5"><div class="empty" style="padding:30px">${ico('mic')}<div>인터뷰 대상자가 없습니다.</div></div></td></tr>`}</tbody>
        </table></div>
      </div>`;
    }).join('');

    $('#view').innerHTML = stats + `<div class="grid" style="gap:18px">${blocks}</div>`;
    $$('#view tbody tr[data-id]').forEach(tr=>tr.onclick=e=>{ if(e.target.closest('a'))return; location.hash='#/applicant/'+tr.dataset.id; });
  }

  function detectHeaderRow(rows){
    // '이름' 또는 '통합연번' 이 포함된 행을 헤더로 탐지
    for (let i=0;i<Math.min(rows.length,8);i++){
      const r=rows[i].map(c=>String(c||'').trim());
      if (r.includes('이름') && (r.includes('트랙구분')||r.includes('통합연번')||r.includes('지원동기'))) return i;
    }
    return 0;
  }

  function handleFile(file){
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const wb=XLSX.read(e.target.result,{type:'array'});
        // 통합신청자명단 우선, 없으면 첫 시트
        let sn = wb.SheetNames.find(n=>n.includes('통합')||n.includes('명단')) || wb.SheetNames[0];
        const ws=wb.Sheets[sn];
        const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
        if(!rows.length){ toast('데이터를 읽을 수 없습니다.','err'); return; }
        const hr=detectHeaderRow(rows);
        const headers=rows[hr].map(c=>String(c||'').trim());
        const dataRows=rows.slice(hr+1).filter(r=>r.some(c=>String(c||'').trim()!==''));
        const parsed=dataRows.map((r,i)=>{
          const o={};
          headers.forEach((h,ci)=>{ const key=COLMAP[h]; if(key){ let v=r[ci];
            if(typeof v==='string') v=v.replace(/_x000D_\n|_x000D_/g,'\n').trim(); o[key]=v; } });
          if(!o.no) o.no=i+1;
          return o;
        }).filter(o=>o.name);
        if(!parsed.length){ toast('신청자 데이터를 인식하지 못했습니다. 컬럼명을 확인하세요.','err'); return; }
        showPreview(parsed, file.name, sn, headers);
      }catch(err){ console.error(err); toast('파일 분석 실패: '+err.message,'err'); }
    };
    reader.readAsArrayBuffer(file);
  }

  function showPreview(parsed, fileName, sheetName, headers){

          <span class="badge b-teal">${parsed.length}명 인식</span>
          <span class="badge b-gray">시트: ${esc(sheetName)}</span>
          <div style="flex:1"></div>
          <button class="btn btn-primary" id="btnConfirm">${ico('check')}이 데이터로 교체</button>
        </div>
        <div class="cell-sub" style="margin-top:8px">인식된 컬럼 ${recognized.length}개: ${recognized.map(esc).join(', ')}</div>
        <div class="table-wrap" style="margin-top:14px"><table class="dt">
          <thead><tr><th style="cursor:default">연번</th><th style="cursor:default">이름</th><th style="cursor:default">트랙</th><th style="cursor:default">학교</th><th style="cursor:default">학과</th><th style="cursor:default">연락처</th><th style="cursor:default">지원동기(요약)</th></tr></thead>
          <tbody>${sample.map(o=>`<tr style="cursor:default"><td class="cell-sub">${esc(o.no)}</td><td class="cell-name">${esc(o.name)}</td><td>${o.track?trackBadge(o.track):'-'}</td><td>${esc(o.school||'-')}</td><td>${esc(o.major||o.college||'-')}</td><td class="cell-sub">${esc(o.phone||'-')}</td><td class="cell-sub">${esc(String(o.motivation||'').slice(0,40))}${String(o.motivation||'').length>40?'…':''}</td></tr>`).join('')}</tbody>
        </table></div>
        ${parsed.length>6?`<div class="cell-sub" style="margin-top:10px;text-align:center">외 ${parsed.length-6}명 …</div>`:''}
      </div>`;
    $('#btnConfirm').onclick=()=>{
      S.replaceApplicants(parsed,{uploadedName:fileName, sourceTitle:'업로드: '+fileName});

      setTimeout(()=>location.hash='#/dashboard',600);

          closeModal(); toast('평가 항목 추가됨','ok'); renderSettings(); }; } });
    });
    // 삭제
    $$('#view [data-delcrit]').forEach(b=>b.onclick=()=>{ const cid=b.dataset.delcrit;
      const g = b.closest('[data-addcrit],.card').querySelector('[data-addcrit]').dataset.addcrit;
      S.removeCriterion(g,cid); toast('항목 삭제됨','ok'); renderSettings(); });

    // 저장
    $('#saveSettings').onclick=()=>{
      // 항목 인라인 수정 반영
      $$('#view .crit[data-cid]').forEach(row=>{
        const cid=row.dataset.cid;
        const g = row.closest('.card').querySelector('[data-addcrit]').dataset.addcrit;
        S.updateCriterion(g,cid,{ name:row.querySelector('[data-f="name"]').value.trim()||'(무제)',
          desc:row.querySelector('[data-f="desc"]').value.trim(), max:Number(row.querySelector('[data-f="max"]').value)||1 });
      });
      const quota={}; $$('#view [data-quota]').forEach(i=>quota[i.dataset.quota]=Number(i.value)||0);
      S.updateConfig({ docPassCut:Number($('#docCut').value)||0, itvPassCut:Number($('#itvCut').value)||0, finalQuota:quota });
      toast('설정이 저장되었습니다','ok'); renderSettings(); renderSidebar('settings');
    };
  }

  /* ───────────────── 시작 ───────────────── */
  S.load();
  if (!location.hash) location.hash = '#/dashboard';
  navigate();
})();

</script>
</body>
</html>
